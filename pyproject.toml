[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# D-008: Pacote publicado no PyPI para execução isolada via uvx
name = "rslapp"
version = "0.1.0"
description = "Servidor MCP em Python para busca acadêmica e exportação para revisão sistemática"
license = "MIT"
# D-001: Linguagem do projeto: Python 3.10 ou mais
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
# D-008: Comando de entrada do servidor MCP
rslapp = "rslapp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rslapp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
