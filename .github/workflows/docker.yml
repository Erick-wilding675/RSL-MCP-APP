# D-011, D-017: Constrói a imagem multi-arquitetura (linux/amd64 e linux/arm64) e publica no ghcr.io a cada tag v*.
name: Publicar imagem Docker no GHCR

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: Construir e publicar imagem multi-arquitetura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU para compilação multi-arquitetura
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # D-017: O metadata-action converte ghcr.io/<dono>/<repositório> para minúsculas automaticamente
      # e gera as tags da versão (v1.1.0, 1.1.0, 1.1) e latest.
      - name: Extrair metadados e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Construir e publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
